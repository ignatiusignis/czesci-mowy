function render(){renderHalf(0);if(mode===2)renderHalf(1);else $('top').innerHTML='<div class="ready">⚽ Rzut '+(round+1)+'/5</div>';$('center').textContent='⚽ '+scores[0]+(mode===2?' : '+scores[1]:' goli')+' · '+(round+1)+'/5'}
function answer(p,c,q){let d=data[p];if(!d||d.idx>=3||finished||paused||q!==d.idx||!d.opts?.includes(c))return;let item=current[d.order[d.idx]];d.answers.push({word:item.word,category:item.category,choice:c,correct:c===item.category});d.idx++;d.opts=null;if(d.idx===3)d.elapsed=performance.now()-d.started;renderHalf(p);if(data.every(x=>x.idx===3)){finished=true;gameDelay(kick,350)}}
function kick(){let p=mode===1?0:turn%2,att=data[p],def=mode===2?data[1-p]:null,a=att.answers.filter(x=>x.correct).length,b=def?def.answers.filter(x=>x.correct).length:0;shotGoal=mode===1?a>=2:(a>b||(a===b&&att.elapsed<def.elapsed));show('shot');$('shot').classList.toggle('upperShot',mode===2&&p===1);$('shotTitle').innerHTML='<span class="shotidentity">Strzela: '+teamTag(p)+'</span>';$('shotOther').innerHTML=mode===2?'<div class="reverseLabel">Strzela: '+teamTag(p)+'</div>':'';$('shot').classList.toggle('duelshot',mode===2);$('shotText').textContent='';$('reviewBtn').classList.add('hidden');let ball=$('ball'),keeper=$('keeper'),kicker=$('kicker'),ak=kits[p],dk=mode===2?kits[1-p]:{main:3,accent:5,shorts:5,pattern:0};let pose=(el,n,k)=>el.innerHTML=sprite(n,k);pose(kicker,'player-idle',ak);pose(keeper,'keeper-idle',dk);ball.style.transition='none';keeper.style.transition='none';kicker.style.transition='none';ball.style.left='50%';ball.style.top='29%';kicker.style.top='68.25%';keeper.style.top='12%';keeper.style.left='50%';keeper.style.transform='translate(-50%,-50%) rotate(180deg)';let dir=Math.random()<.5?-1:1;let strong=mode===1?a===3:shotGoal&&a===3;let fire=$('fireBtn');fire.classList.remove('hidden');fire.onclick=()=>{if(paused)return;fire.classList.add('hidden');fire.onclick=null;if(shotGoal)scores[p]++;history[p].push({goal:shotGoal,words:current.map(x=>x.word)});gameDelay(()=>{kicker.style.transition='top 1.2375s linear';kicker.style.top='39%';pose(kicker,'player-run1',ak)},200);for(let i=0;i<5;i++)gameDelay(()=>pose(kicker,i%2?'player-run1':'player-run2',ak),400+i*205);gameDelay(()=>{pose(kicker,'player-kick',ak);ball.style.transition='left .85s ease-out,top .85s ease-out';keeper.style.transition='left .85s ease,transform .85s ease';let dive=shotGoal&&strong?-dir:dir;pose(keeper,dive<0?'keeper-dive-right':'keeper-dive-left',dk);keeper.style.left=(50+dive*(shotGoal?strong?10:5:9))+'%';keeper.style.transform='translate(-50%,-50%) rotate('+(180+dive*65)+'deg)';ball.style.left=(50+dir*(shotGoal?(strong?9:6):9))+'%';ball.style.top=shotGoal?'2.5%':'12%'},1450);gameDelay(()=>{pose(kicker,shotGoal?'player-idle':'player-sad',ak);pose(keeper,shotGoal?'keeper-sad':'keeper-idle',dk);if(shotGoal){ball.style.transition='none';ball.style.left=(50+dir*(strong?9:6))+'%';ball.style.top='3.5%';}if(!shotGoal){keeper.style.transition='transform .2s ease';keeper.style.transform='translate(-50%,-50%) rotate(180deg)';ball.style.left=keeper.style.left;ball.style.top=keeper.style.top;}$('shotText').textContent=shotGoal?'GOL!':'OBRONA!';$('shotText').style.color=shotGoal?'#a7ffad':'#a8dcff';},2350);gameDelay(()=>$('reviewBtn').classList.remove('hidden'),2550)}}
function review(){show('summary');$('summaryTitle').textContent=shotGoal?'⚽ Gol!':'🧤 Obrona!';let pShot=mode===1?0:turn%2;let h='<div class="shotidentity">Strzelał: '+teamTag(pShot)+'</div><div class="score">Wynik: '+scores[0]+(mode===2?' : '+scores[1]:' / 5')+'</div>';for(let p=0;p<mode;p++){let d=data[p];h+='<article style="border-color:'+colors[kits[p].main]+'"><b>'+teamTag(p)+' · '+d.answers.filter(x=>x.correct).length+'/3 · '+(d.elapsed/1000).toFixed(2)+' s</b>';for(let a of d.answers)h+='<p class="'+(a.correct?'ok':'bad')+'">'+(a.correct?'✓':'✗')+' '+a.word+' — '+labels[a.choice]+(a.correct?'':' → '+labels[a.category])+'</p>';h+='</article>'}$('summaryContent').innerHTML=h;let end=mode===1?round===4:round===4&&turn===1;$('nextBtn').textContent=end?'Zakończ mecz':'Następny rzut'}
function next(){if(mode===2&&turn===0){turn=1;nextRound();return}turn=0;round++;if(round>=5){show('summary');$('summaryTitle').textContent='Koniec meczu!';$('summaryContent').innerHTML='<div class="score">'+(mode===1?'Zdobyte gole: '+scores[0]+' / 5':scores[0]===scores[1]?'Remis '+scores[0]+':'+scores[1]:'Wygrywa gracz '+(scores[0]>scores[1]?1:2)+'! '+scores.join(':'))+'</div><p class="small">Wersja 1.2.0</p>';if(mode===2&&scores[0]!==scores[1]){let w=scores[0]>scores[1]?0:1;let card='<div class="winnercard" style="--team:'+colors[kits[w].main]+'">'+sprite('player-celebrate',kits[w])+'<div>Wygrywa '+teamName(w)+'!</div><div>'+scores[w]+' : '+scores[1-w]+'</div></div>';$('summaryContent').innerHTML='<div class="reverseLabel">'+card+'</div>'+card;}$('nextBtn').textContent='Menu główne';$('nextBtn').onclick=()=>{ $('nextBtn').onclick=next;show('welcome')};return}nextRound()}

let practiceMode=false,practiceWords=[],practiceTarget=0,practicePicked=new Set(),practiceGoals=0,practiceLocked=false;
const practiceNames=['rzeczowniki','czasowniki','przymiotniki','przysłówki','liczebniki','zaimki','przyimki','spójniki','partykuły','wykrzykniki'];
function openMenu(training){matchMode=false;$('matchSettings').classList.add('hidden');practiceMode=training;$('matchChoices').classList.toggle('hidden',training);$('practiceStart').classList.toggle('hidden',!training);show('menu')}
function startPractice(){if(selected.length<3)return;clearGameTimers();practiceMode=true;practiceGoals=0;practiceRound()}
function practiceRound(){practiceLocked=false;practicePicked=new Set();practiceTarget=selected[Math.floor(Math.random()*selected.length)];const count=Math.min(words[practiceTarget].length,4+Math.floor(Math.random()*5));const targets=shuffle(words[practiceTarget]).slice(0,count).map(word=>({word,category:practiceTarget}));const others=shuffle(selected.filter(c=>c!==practiceTarget).flatMap(category=>words[category].map(word=>({word,category})))).slice(0,20-count);practiceWords=shuffle([...targets,...others]);$('practiceScore').textContent='⚽ Gole: '+practiceGoals;$('practicePrompt').textContent='Zaznacz wszystkie '+practiceNames[practiceTarget];$('practiceCheck').disabled=false;const grid=$('practiceGrid');grid.replaceChildren();practiceWords.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed','false');const word=document.createElement('span');word.textContent=item.word;const status=document.createElement('small');b.append(word,status);b.onclick=()=>{if(paused||practiceLocked)return;if(practicePicked.has(i))practicePicked.delete(i);else practicePicked.add(i);b.classList.toggle('chosen',practicePicked.has(i));b.setAttribute('aria-pressed',String(practicePicked.has(i)));status.textContent='';status.className=''};grid.append(b)});show('practice')}
function checkPractice(){if(paused||practiceLocked)return;let correct=true;[...$('practiceGrid').children].forEach((b,i)=>{const target=practiceWords[i].category===practiceTarget,picked=practicePicked.has(i),s=b.querySelector('small');s.textContent=target&&picked?'dobrze':picked?'błąd':target?'jeszcze to':'';s.className=target&&picked?'good':target!==picked?'wrong':'';if(target!==picked)correct=false});practiceLocked=true;$('practiceCheck').disabled=true;if(correct){practiceGoals++;$('practiceScore').textContent='⚽ Gole: '+practiceGoals}gameDelay(()=>practiceShot(correct),900)}
function practiceShot(goal){const endX=goal?50:(Math.random()<.5?18:82);show('practiceShot');const b=$('practiceBall'),k=$('practiceKicker'),kit=kits[0];$('practiceGoal').textContent='⚽ Gole: '+practiceGoals;b.style.transition='none';b.style.left='50%';b.style.top='29%';k.style.transition='none';k.style.top='68.25%';k.innerHTML=sprite('player-idle',kit);gameDelay(()=>{k.style.transition='top .8s linear';k.style.top='39%';k.innerHTML=sprite('player-run1',kit)},100);gameDelay(()=>{k.innerHTML=sprite('player-run2',kit)},450);gameDelay(()=>{k.innerHTML=sprite('player-kick',kit);b.style.transition='top .55s ease-out,left .55s ease-out';b.style.left=endX+'%';b.style.top='3.5%'},900);gameDelay(()=>{b.style.transition='none';b.style.top='3.5%';b.style.left=endX+'%';$('practiceGoal').textContent=goal?'GOL! ⚽ '+practiceGoals:'PUDŁO!';k.innerHTML=sprite(goal?'player-idle':'player-sad',kit)},1500);gameDelay(()=>{if(goal)practiceRound();else{practiceLocked=false;$('practiceCheck').disabled=false;show('practice')}},2050)}

let matchMode=false,matchEnd=0,matchScore=[0,0],matchZone=6,matchOwner=0,matchQuestion=null,matchAnswered=[],matchLive=false,matchToken=0,matchDeadline=0,matchX=50,matchLastWord='';
function openMatchMenu(){openMenu(false);matchMode=true;$('matchChoices').classList.add('hidden');$('matchSettings').classList.remove('hidden')}
function setupMatch(m){if(selected.length<3)return;matchMode=true;practiceMode=false;mode=m;show('custom');drawConfigs()}
$('matchLevel').innerHTML=Array.from({length:10},(_,i)=>'<option '+(i===4?'selected':'')+'>'+(i+1)+'</option>').join('');
function startMatch(){clearGameTimers();matchMode=true;practiceMode=false;matchScore=[0,0];matchZone=6;matchOwner=0;matchX=50;matchLastWord='';matchLive=false;matchToken++;matchEnd=performance.now()+Number($('matchMinutes').value)*60000;show('match');$('matchTop').classList.toggle('reverse',mode===2);$('matchPlayers').replaceChildren();for(let p=0;p<2;p++)for(let i=0;i<6;i++){const el=document.createElement('div');el.className='matchMan';el.id='man'+p+'_'+i;$('matchPlayers').append(el)}matchScene(false);matchTick();matchCountdown()}
function matchY(){return 4.46+matchZone*91.08/12}
function matchScene(moving){const y=matchY();for(let p=0;p<2;p++){const dir=p===0?-1:1;for(let i=0;i<6;i++){const el=$('man'+p+'_'+i);let x=i===0?50:i===1&&p===matchOwner?matchX:[50,50,22,78,32,68][i];let yy=i===0?(p===0?93:7):i===1&&p===matchOwner?y-dir*2.8:Math.max(9,Math.min(91,y+dir*([0,3,12,12,-13,-13][i])+(p===matchOwner?0:-dir*7)));if(moving&&i!==0&&!(i===1&&p===matchOwner)){x+=Math.random()*10-5;yy+=Math.random()*4-2}el.style.left=x+'%';el.style.top=yy+'%';el.innerHTML=sprite(i===0?'keeper-idle':moving?'player-run'+(1+Math.floor(Math.random()*2)):'player-idle',kits[p]);el.style.transform='translate(-50%,-50%) rotate('+(p===0?0:180)+'deg)'}}const b=$('matchBall');b.style.left=matchX+'%';b.style.top=y+'%';matchCamera(y)}
function matchCamera(y){const v=$('matchViewport'),w=$('matchWorld');const height=w.offsetHeight;const offset=Math.max(0,Math.min(Math.max(0,height-v.clientHeight),height*y/100-v.clientHeight/2));w.style.transform='translateY('+(-offset)+'px)'}
window.addEventListener('resize',()=>{if(matchMode&&!$('match').classList.contains('hidden'))matchCamera(matchY())});
function matchTick(){if(!matchMode)return;const left=Math.max(0,Math.ceil((matchEnd-performance.now())/1000));$('matchClock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('matchScore').textContent=matchScore.join(' : ');if(!left){finishMatch();return}gameDelay(matchTick,100)}
function matchPanel(p){return $(p===0?'matchBottom':'matchTop')}
function matchMessage(msg){for(let p=0;p<2;p++)matchPanel(p).innerHTML='<b>'+ (p===0?'Gracz 1':mode===1?'Komputer':'Gracz 2')+' · '+(p===matchOwner?'ATAK':'OBRONA')+'</b><div class="question">'+msg+'</div>'}
function matchCountdown(){matchLive=false;matchMessage('2');gameDelay(()=>matchMessage('1'),700);gameDelay(()=>matchMessage('START!'),1400);gameDelay(matchAsk,1750)}
function matchAsk(){let pool=selected.flatMap(category=>words[category].map(word=>({word,category}))).filter(x=>x.word!==matchLastWord);matchQuestion=pool[Math.floor(Math.random()*pool.length)];matchLastWord=matchQuestion.word;matchAnswered=[false,false];matchLive=true;const token=++matchToken;matchDeadline=performance.now()+7000;for(let p=0;p<2;p++){const root=matchPanel(p);root.innerHTML='<b>'+ (p===0?'Gracz 1':mode===1?'Komputer':'Gracz 2')+' · '+(p===matchOwner?'ATAK':'OBRONA')+' · <span class="matchSeconds">7</span> s</b><div class="question">'+matchQuestion.word.toUpperCase()+'</div><div class="answers"></div>';for(const c of options(matchQuestion.category)){const b=document.createElement('button');b.textContent=labels[c];b.dataset.c=c;b.disabled=p===1&&mode===1;b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();matchAnswer(p,c,token)});b.addEventListener('click',e=>{if(e.detail===0)matchAnswer(p,c,token)});root.querySelector('.answers').append(b)}}let seconds=7;function tick(){if(!matchLive||token!==matchToken)return;seconds--;document.querySelectorAll('.matchSeconds').forEach(el=>el.textContent=seconds);if(seconds<=0)matchResolve(-1);else gameDelay(tick,1000)}gameDelay(tick,1000);if(mode===1){const level=Number($('matchLevel').value),chance=[.3,.4,.5,.6,.7,.75,.8,.85,.9,.95][level-1];gameDelay(()=>{if(!matchLive||token!==matchToken)return;const c=Math.random()<chance?matchQuestion.category:shuffle(selected.filter(c=>c!==matchQuestion.category))[0];matchAnswer(1,c,token)},Math.max(650,3800-level*250)+Math.random()*1000)}}
function matchAnswer(p,c,token){if(paused||!matchLive||token!==matchToken||matchAnswered[p])return;matchAnswered[p]=true;const root=matchPanel(p);for(const b of root.querySelectorAll('button')){b.disabled=true;if(Number(b.dataset.c)===c)b.classList.add(c===matchQuestion.category?'good':'wrong')}if(c===matchQuestion.category)matchResolve(p);else if(matchAnswered.every(Boolean))matchResolve(-1)}
function matchResolve(winner){if(!matchLive)return;matchLive=false;for(const b of $('match').querySelectorAll('.answers button')){b.disabled=true;if(Number(b.dataset.c)===matchQuestion.category)b.classList.add('good')}const old=matchOwner;let message;if(winner===old){const next=matchZone+(old===0?-1:1);if(next===0||next===12){matchZone=next;matchX=50;matchScore[old]++;message='GOL!';}else{matchZone=next;matchX=[24,40,60,76][Math.floor(Math.random()*4)];message=Math.random()<.5?'UDANE PODANIE':'DRYBLING'}}else{matchOwner=1-old;message=(matchZone===1&&old===0||matchZone===11&&old===1)?'OBRONA!':'PRZEJĘCIE PIŁKI'}gameDelay(()=>{matchMessage(message);matchScene(true);$('matchScore').textContent=matchScore.join(' : ')},450);gameDelay(()=>{if(message==='GOL!'){matchZone=6;matchOwner=1-old;matchX=50}matchScene(false);matchCountdown()},1550)}
function finishMatch(){matchLive=false;clearGameTimers();show('summary');$('summaryTitle').textContent='Koniec meczu!';$('summaryContent').textContent=matchScore.join(' : ');$('nextBtn').textContent='Menu główne';$('nextBtn').onclick=()=>{matchMode=false;$('nextBtn').onclick=next;show('welcome')}}
categories();
</script></body></html>
