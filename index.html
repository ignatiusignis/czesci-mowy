let svgSerial=0;

function kitSvg(k){return sprite('player-idle',k,'class="kit"')}

function drawConfigs(){let html='';$('custom').classList.toggle('duel',mode===2);for(let i of (mode===2?[1,0]:[0])){let k=kits[i];if(mode===2&&i===0)html+='<div class="startmiddle"><button onclick="show(\'menu\')">Wróć</button><button onclick="start()">Rozpocznij mecz ⚽</button></div>';html+='<div class="configcard '+(i===1?'reverse':'')+'" style="--team:'+colors[k.main]+'"><h3>'+teamName(i)+'</h3><div class="playerconfig"><div>'+kitSvg(k)+'</div><div><div class="configline">Kolor koszulki<div class="palette">'+swatches(i,'main')+'</div></div><div class="configline">Drugi kolor<div class="palette">'+swatches(i,'accent')+'</div></div><div class="configline">Spodenki<div class="palette">'+swatches(i,'shorts')+'</div></div><select onchange="setKit('+i+',\'pattern\',+this.value)">'+patterns.map((p,n)=>'<option value="'+n+'" '+(n===k.pattern?'selected':'')+'>'+p+'</option>').join('')+'</select></div></div></div>'} $('configs').innerHTML=html}
function swatches(i,key){return colors.map((c,n)=>'<button aria-label="Kolor '+(n+1)+'" class="swatch '+(kits[i][key]===n?'active':'')+'" style="background:'+c+'" onclick="setKit('+i+',\''+key+'\','+n+')"></button>').join('')}
function setKit(i,key,n){kits[i][key]=n;drawConfigs()}
function start(){clearGameTimers();round=0;turn=0;scores=[0,0];history=[[],[]];nextRound()}
function makeSet(){let used=new Set(),out=[];while(out.length<3){let c=selected[Math.floor(Math.random()*selected.length)],pool=shuffle(words[c]);let word=pool.find(w=>!used.has(w)&&!history.flat().some(h=>h.words?.includes(w)));if(!word)word=pool.find(w=>!used.has(w));if(!word)continue;used.add(word);out.push({word,category:c})}return out}
function nextRound(){current=makeSet();data=Array.from({length:mode},(_,p)=>({order:p===0?[0,1,2]:shuffle([0,1,2]),idx:0,answers:[],started:performance.now(),elapsed:0}));if(mode===2&&data[1].order.every((v,i)=>v===i))data[1].order=[1,2,0];finished=true;show('play');countdown()}
function themeHalf(p){let root=$(p===0?'bottom':'top'),c=colors[kits[p].main],v=parseInt(c.slice(1),16),r=v>>16,g=v>>8&255,b=v&255;let lum=[r,g,b].map(x=>{x/=255;return x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4)});root.classList.add('team');root.style.setProperty('--team',c);root.style.setProperty('--ink',.2126*lum[0]+.7152*lum[1]+.0722*lum[2]>.179?'#101820':'#fff')}
let paused=false,pauseAt=0,pauseScreen='',gameTimers=new Set(),frozenAnimations=[];
function gameDelay(fn,ms){let t={fn,remaining:ms,id:null,due:0};gameTimers.add(t);armTimer(t)}
function armTimer(t){t.due=performance.now()+t.remaining;t.id=setTimeout(()=>{gameTimers.delete(t);t.fn()},t.remaining)}
function clearGameTimers(){for(let t of gameTimers)clearTimeout(t.id);gameTimers.clear();for(let a of frozenAnimations)a.cancel();frozenAnimations=[];paused=false}
function pauseGame(){if(paused)return;pauseScreen=$('play').classList.contains('hidden')?'shot':'play';pauseAt=performance.now();paused=true;for(let t of gameTimers){clearTimeout(t.id);t.remaining=Math.max(0,t.due-pauseAt)}frozenAnimations=pauseScreen==='shot'&&$('shot').getAnimations?$('shot').getAnimations({subtree:true}):[];for(let a of frozenAnimations)a.pause();$('pause').classList.remove('hidden');$('pause').style.position='fixed';$('pause').style.inset='0';$('pause').style.zIndex='100';$('pause').style.background='#102b45';}

function exitGame(){clearGameTimers();$('nextBtn').onclick=next;show('welcome')}
function countdown(){themeHalf(0);if(mode===2)themeHalf(1);else $('top').classList.remove('team');$('center').textContent='Rzut '+(round+1)+'/5';let n=3;function tick(){let label=n>0?String(n):'START!';for(let p=0;p<mode;p++)$(p===0?'bottom':'top').innerHTML='<div class="small">'+teamName(p)+'</div><div class="countnum">'+label+'</div>';if(mode===1)$('top').innerHTML='<div class="ready">Przygotuj się!</div>';if(n>0){n--;gameDelay(tick,1000)}else gameDelay(()=>{render();let t=performance.now();data.forEach(d=>d.started=t);finished=false},450)}tick()}
function options(c){return shuffle([c,...shuffle(selected.filter(x=>x!==c)).slice(0,2)])}
function renderHalf(p){let d=data[p],root=$(p===0?'bottom':'top');themeHalf(p);if(d.idx>=3){root.innerHTML='<div class="ready">✓ Gotowe! Czekaj na rywala</div>';return}let item=current[d.order[d.idx]];if(!d.opts)d.opts=options(item.category);root.innerHTML='<div class="small">Gracz '+(p+1)+' · Pytanie '+(d.idx+1)+'/3</div><div class="question">'+item.word.toUpperCase()+'</div><div class="answers">'+d.opts.map(c=>'<button onclick="answer('+p+','+c+')">'+labels[c]+'</button>').join('')+'</div>'}
function render(){renderHalf(0);if(mode===2)renderHalf(1);else $('top').innerHTML='<div class="ready">⚽ Rzut '+(round+1)+'/5</div>';$('center').textContent='⚽ '+scores[0]+(mode===2?' : '+scores[1]:' goli')+' · '+(round+1)+'/5'}
function answer(p,c){let d=data[p];if(d.idx>=3||finished||paused)return;let item=current[d.order[d.idx]];d.answers.push({word:item.word,category:item.category,choice:c,correct:c===item.category});d.idx++;d.opts=null;if(d.idx===3)d.elapsed=performance.now()-d.started;render();if(data.every(x=>x.idx===3)){finished=true;gameDelay(kick,350)}}
function kick(){let p=mode===1?0:turn%2,att=data[p],def=mode===2?data[1-p]:null,a=att.answers.filter(x=>x.correct).length,b=def?def.answers.filter(x=>x.correct).length:0;shotGoal=mode===1?a>=2:(a>b||(a===b&&att.elapsed<def.elapsed));show('shot');$('shot').classList.toggle('upperShot',mode===2&&p===1);$('shotTitle').innerHTML='<span class="shotidentity">Strzela: '+teamTag(p)+'</span>';$('shotOther').innerHTML=mode===2?'<div class="reverseLabel">Strzela: '+teamTag(p)+'</div>':'';$('shot').classList.toggle('duelshot',mode===2);$('shotText').textContent='';$('reviewBtn').classList.add('hidden');let ball=$('ball'),keeper=$('keeper'),kicker=$('kicker'),ak=kits[p],dk=mode===2?kits[1-p]:{main:3,accent:5,shorts:5,pattern:0};let pose=(el,n,k)=>el.innerHTML=sprite(n,k);pose(kicker,'player-idle',ak);pose(keeper,'keeper-idle',dk);ball.style.transition='none';keeper.style.transition='none';kicker.style.transition='none';ball.style.left='50%';ball.style.top='29%';kicker.style.top='78%';keeper.style.top='12%';keeper.style.left='50%';keeper.style.transform='translate(-50%,-50%) rotate(180deg)';let dir=Math.random()<.5?-1:1;let strong=mode===1?a===3:shotGoal&&a===3;let fire=$('fireBtn');fire.classList.remove('hidden');fire.onclick=()=>{if(paused)return;fire.classList.add('hidden');fire.onclick=null;if(shotGoal)scores[p]++;history[p].push({goal:shotGoal,words:current.map(x=>x.word)});gameDelay(()=>{kicker.style.transition='top 1.65s linear';kicker.style.top='39%';pose(kicker,'player-run1',ak)},200);for(let i=0;i<5;i++)gameDelay(()=>pose(kicker,i%2?'player-run1':'player-run2',ak),480+i*270);gameDelay(()=>{pose(kicker,'player-kick',ak);ball.style.transition='left 1.05s ease-out,top 1.05s ease-out';keeper.style.transition='left .85s ease,transform .85s ease';let dive=shotGoal&&strong?-dir:dir;pose(keeper,dive<0?'keeper-dive-right':'keeper-dive-left',dk);keeper.style.left=(50+dive*(shotGoal?strong?10:5:9))+'%';keeper.style.transform='translate(-50%,-50%) rotate('+(180+dive*65)+'deg)';ball.style.left=(50+dir*(shotGoal?(strong?10:7):9))+'%';ball.style.top=shotGoal?'2.5%':'12%'},1900);gameDelay(()=>{pose(kicker,shotGoal?'player-celebrate':'player-sad',ak);pose(keeper,shotGoal?'keeper-sad':'keeper-catch',dk);if(!shotGoal){ball.style.left=keeper.style.left;ball.style.top=keeper.style.top;}$('shotText').textContent=shotGoal?'GOL!':'OBRONA!';$('shotText').style.color=shotGoal?'#a7ffad':'#a8dcff';$('reviewBtn').classList.remove('hidden')},3550)}}
function review(){show('summary');$('summaryTitle').textContent=shotGoal?'⚽ Gol!':'🧤 Obrona!';let pShot=mode===1?0:turn%2;let h='<div class="shotidentity">Strzelał: '+teamTag(pShot)+'</div><div class="score">Wynik: '+scores[0]+(mode===2?' : '+scores[1]:' / 5')+'</div>';for(let p=0;p<mode;p++){let d=data[p];h+='<article style="border-color:'+colors[kits[p].main]+'"><b>'+teamTag(p)+' · '+d.answers.filter(x=>x.correct).length+'/3 · '+(d.elapsed/1000).toFixed(2)+' s</b>';for(let a of d.answers)h+='<p class="'+(a.correct?'ok':'bad')+'">'+(a.correct?'✓':'✗')+' '+a.word+' — '+labels[a.choice]+(a.correct?'':' → '+labels[a.category])+'</p>';h+='</article>'}$('summaryContent').innerHTML=h;let end=mode===1?round===4:round===4&&turn===1;$('nextBtn').textContent=end?'Zakończ mecz':'Następny rzut'}
function next(){if(mode===2&&turn===0){turn=1;nextRound();return}turn=0;round++;if(round>=5){show('summary');$('summaryTitle').textContent='Koniec meczu!';$('summaryContent').innerHTML='<div class="score">'+(mode===1?'Zdobyte gole: '+scores[0]+' / 5':scores[0]===scores[1]?'Remis '+scores[0]+':'+scores[1]:'Wygrywa gracz '+(scores[0]>scores[1]?1:2)+'! '+scores.join(':'))+'</div><p class="small">Wersja 0.2.7 – dogrywka po remisie będzie dodana w kolejnej aktualizacji.</p>';if(mode===2&&scores[0]!==scores[1]){let w=scores[0]>scores[1]?0:1;let card='<div class="winnercard" style="--team:'+colors[kits[w].main]+'">'+sprite('player-celebrate',kits[w])+'<div>Wygrywa '+teamName(w)+'!</div><div>'+scores[w]+' : '+scores[1-w]+'</div></div>';$('summaryContent').innerHTML='<div class="reverseLabel">'+card+'</div>'+card;}$('nextBtn').textContent='Menu główne';$('nextBtn').onclick=()=>{ $('nextBtn').onclick=next;show('welcome')};return}nextRound()}
