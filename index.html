<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pojedynek Wyrazów 0.1.0</title>
<style>
:root{font-family:Arial,sans-serif;color:#fff;background:#102b29}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:13px;background:#f5d44d;color:#172c2a;font-weight:700;touch-action:manipulation}button:disabled{opacity:.4}.screen{min-height:100dvh;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.hidden{display:none!important}h1,h2,p{margin:5px}h1{text-align:center} .panel{width:min(100%,620px);padding:17px;border:2px solid #497d69;border-radius:18px;background:#183f39}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choices label{padding:10px;border-radius:9px;background:#24554b}.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.palette{display:flex;gap:6px;flex-wrap:wrap}.swatch{width:32px;height:32px;border:2px solid white;border-radius:50%;padding:0}.swatch.active{outline:3px solid #f5d44d}.playerconfig{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center}.kit{width:92px;height:115px}.configline{margin:8px 0}.small{font-size:13px;opacity:.85}.quiz{height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:7px;gap:7px}.half{flex:1;min-height:0;background:#20544b;border-radius:15px;padding:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}.half.top{transform:rotate(180deg);background:#254a71}.question{font-size:clamp(25px,6vw,42px);font-weight:bold}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:100%}.answers button{padding:16px 3px;font-size:clamp(11px,3vw,17px);overflow-wrap:anywhere}.divider{flex:none;min-height:24px;text-align:center;font-size:14px;background:#0c2523;border-radius:8px;padding:4px}.ready{font-size:20px;font-weight:bold}.field{width:min(95vw,460px);height:min(70vh,560px);background:repeating-linear-gradient(0deg,#2d9952 0 65px,#27894b 65px 130px);border:5px solid white;position:relative;overflow:hidden;border-radius:10px}.goal{position:absolute;top:6%;left:19%;width:62%;height:17%;border:6px solid white;background:repeating-linear-gradient(90deg,transparent 0 14px,#ffffff55 15px 16px),repeating-linear-gradient(0deg,transparent 0 13px,#ffffff55 14px 15px)}.keeper{position:absolute;top:20%;left:50%;font-size:40px;transform:translate(-50%,-50%);transition:transform .65s}.ball{position:absolute;left:50%;top:77%;font-size:30px;transform:translate(-50%,-50%);transition:left .85s ease-in,top .85s ease-in}.kicker{position:absolute;left:50%;top:89%;font-size:40px;transform:translate(-50%,-50%)}.result{max-height:65vh;overflow:auto;width:min(100%,620px)}.result article{background:#214e46;border-radius:10px;margin:8px 0;padding:10px}.ok{color:#9df5a4}.bad{color:#ffb5a8}.score{font-size:25px;font-weight:bold}select{padding:9px;border-radius:8px;width:100%}@media(max-height:600px){.half{gap:4px;padding:6px}.answers button{padding:9px 2px}.question{font-size:24px}}
</style></head><body>
<section id="menu" class="screen"><h1>⚽ Pojedynek Wyrazów</h1><p>Wersja testowa 0.1.0</p><div class="panel"><h2>Wybierz części mowy (minimum 3)</h2><div id="categories" class="choices"></div><p id="warning" class="small"></p></div><div class="row"><button onclick="setup(1)">1 gracz</button><button onclick="setup(2)">2 graczy</button></div></section>
<section id="custom" class="screen hidden"><h2>Przygotuj zawodników</h2><div id="configs" class="panel"></div><button onclick="start()">Rozpocznij mecz ⚽</button><button onclick="show('menu')">Wróć</button></section>
<section id="play" class="quiz hidden"><div id="top" class="half top"></div><div id="center" class="divider"></div><div id="bottom" class="half"></div></section>
<section id="shot" class="screen hidden"><h2 id="shotTitle">Rzut karny!</h2><div class="field"><div class="goal"></div><div id="keeper" class="keeper">🧤</div><div id="ball" class="ball">⚽</div><div id="kicker" class="kicker">🏃</div></div><p id="shotText" class="score"></p><button id="reviewBtn" class="hidden" onclick="review()">Zobacz odpowiedzi i czas</button></section>
<section id="summary" class="screen hidden"><h2 id="summaryTitle"></h2><div id="summaryContent" class="result"></div><button id="nextBtn" onclick="next()">Dalej</button></section>
<script>
const labels=['Rzeczownik','Czasownik','Przymiotnik','Przysłówek','Liczebnik'];
const words=[
['kot','dom','kamień','pies','szkoła','książka','rower','drzewo','okno','jabłko','morze','rzeka','plecak','krzesło','kwiat','słońce','piłka','dziecko','zegar','ogród','chmura','las','motyl','zeszyt','nauczyciel','łyżka','samolot','góra','deszcz','ogród'],
['biega','skacze','czyta','pisze','maluje','śpiewa','tańczy','pływa','rysuje','gotuje','śpi','odpoczywa','pracuje','rośnie','płynie','leci','gra','szuka','liczy','sprząta','buduje','otwiera','zamyka','słucha','ogląda','podskakuje','spaceruje','wędruje','podaje','kibicuje'],
['zielony','wesoły','mały','wysoka','czerwone','miękki','ciepła','zimne','szeroki','wąska','piękny','gruby','cienka','słodkie','kwaśny','jasny','ciemna','szybki','wolna','nowe','stary','czysta','mokry','sucha','głośny','cicha','długi','krótka','okrągły','kolorowe'],
['szybko','wolno','cicho','głośno','ładnie','starannie','wczoraj','dzisiaj','jutro','tutaj','tam','daleko','blisko','wcześnie','późno','często','rzadko','ostrożnie','spokojnie','wesoło','smutno','lekko','mocno','nagle','powoli','wysoko','nisko','dobrze','źle','razem'],
['jeden','dwa','trzy','cztery','pięć','sześć','siedem','osiem','dziewięć','dziesięć','pierwszy','drugi','trzeci','czwarty','piąty','szósty','siódmy','ósmy','dziewiąty','dziesiąty','jedenaście','dwanaście','trzynaście','czternaście','piętnaście','dwadzieścia','trzydzieści','czterdzieści','pięćdziesiąt','sto']
];
const colors=['#e83c42','#2775e7','#25a35d','#f8d53e','#ffffff','#171c29','#f38a31','#9b5ce2'];
const patterns=['Jednolita','Pasy pionowe','Pasy poziome','Szachownica','Ukośny pas','Dwie połowy'];
let mode=1,selected=[0,1,2],kits=[{main:0,accent:4,shorts:5,pattern:0},{main:1,accent:4,shorts:4,pattern:1}],round=0,turn=0,scores=[0,0],history=[[],[]],current=[],data=[],finished=false,shotGoal=false;
const $=id=>document.getElementById(id);
function show(id){for(const s of document.querySelectorAll('body>section'))s.classList.toggle('hidden',s.id!==id)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function categories(){ $('categories').innerHTML=labels.map((x,i)=>'<label><input type="checkbox" '+(selected.includes(i)?'checked':'')+' onchange="toggle('+i+',this.checked)"> '+x+'</label>').join('');$('warning').textContent=selected.length<3?'Zaznacz co najmniej 3 części mowy.':'Wybrano '+selected.length+' z 5.'}
function toggle(i,on){selected=on?[...selected,i]:selected.filter(x=>x!==i);categories()}
function setup(m){if(selected.length<3)return;mode=m;show('custom');drawConfigs()}
function kitSvg(k){let a=colors[k.main],b=colors[k.accent],p=k.pattern;let pattern=p===0?'':p===1?'<path d="M32 33v47M47 33v47M62 33v47" stroke="'+b+'" stroke-width="9"/>':p===2?'<path d="M25 45h44M25 62h44" stroke="'+b+'" stroke-width="12"/>':p===3?'<path d="M25 35h44M25 58h44" stroke="'+b+'" stroke-width="13" stroke-dasharray="12 10"/>':p===4?'<path d="M28 75L62 35" stroke="'+b+'" stroke-width="16"/>':'<path d="M47 32v49h23V32Z" fill="'+b+'"/>';return '<svg class="kit" viewBox="0 0 95 115"><circle cx="47" cy="15" r="12" fill="#edb889"/><path d="M31 29L15 34L4 55L18 61L27 45V79H68V45L77 61L91 55L79 34L63 29Z" fill="'+a+'" stroke="#172d2a" stroke-width="2"/><clipPath id="clip'+k.main+k.pattern+'"><path d="M31 29L15 34L4 55L18 61L27 45V79H68V45L77 61L91 55L79 34L63 29Z"/></clipPath><g clip-path="url(#clip'+k.main+k.pattern+')">'+pattern+'</g><path d="M27 79H68V100H49L47 91L45 100H27Z" fill="'+colors[k.shorts]+'" stroke="#172d2a" stroke-width="2"/></svg>'}
function drawConfigs(){let html='';for(let i=0;i<mode;i++){let k=kits[i];html+='<h3>Gracz '+(i+1)+'</h3><div class="playerconfig"><div>'+kitSvg(k)+'</div><div><div class="configline">Kolor koszulki<div class="palette">'+swatches(i,'main')+'</div></div><div class="configline">Drugi kolor<div class="palette">'+swatches(i,'accent')+'</div></div><div class="configline">Spodenki<div class="palette">'+swatches(i,'shorts')+'</div></div><select onchange="setKit('+i+',\'pattern\',+this.value)">'+patterns.map((p,n)=>'<option value="'+n+'" '+(n===k.pattern?'selected':'')+'>'+p+'</option>').join('')+'</select></div></div>'} $('configs').innerHTML=html}
function swatches(i,key){return colors.map((c,n)=>'<button aria-label="Kolor '+(n+1)+'" class="swatch '+(kits[i][key]===n?'active':'')+'" style="background:'+c+'" onclick="setKit('+i+',\''+key+'\','+n+')"></button>').join('')}
function setKit(i,key,n){kits[i][key]=n;drawConfigs()}
function start(){round=0;turn=0;scores=[0,0];history=[[],[]];nextRound()}
function makeSet(){let used=new Set(),out=[];while(out.length<3){let c=selected[Math.floor(Math.random()*selected.length)],pool=shuffle(words[c]);let word=pool.find(w=>!used.has(w)&&!history.flat().some(h=>h.words?.includes(w)));if(!word)word=pool.find(w=>!used.has(w));if(!word)continue;used.add(word);out.push({word,category:c})}return out}
function nextRound(){current=makeSet();data=Array.from({length:mode},(_,p)=>({order:p===0?[0,1,2]:shuffle([0,1,2]),idx:0,answers:[],started:performance.now(),elapsed:0}));if(mode===2&&data[1].order.every((v,i)=>v===i))data[1].order=[1,2,0];finished=false;show('play');render()}
function options(c){return shuffle([c,...shuffle(selected.filter(x=>x!==c)).slice(0,2)])}
function renderHalf(p){let d=data[p],root=$(p===0?'bottom':'top');if(d.idx>=3){root.innerHTML='<div class="ready">✓ Gotowe! Czekaj na rywala</div>';return}let item=current[d.order[d.idx]];if(!d.opts)d.opts=options(item.category);root.innerHTML='<div class="small">Gracz '+(p+1)+' · Pytanie '+(d.idx+1)+'/3</div><div class="question">'+item.word.toUpperCase()+'</div><div class="answers">'+d.opts.map(c=>'<button onclick="answer('+p+','+c+')">'+labels[c]+'</button>').join('')+'</div>'}
function render(){renderHalf(0);if(mode===2)renderHalf(1);else $('top').innerHTML='<div class="ready">⚽ Rzut '+(round+1)+'/5</div>';$('center').textContent='⚽ '+scores[0]+(mode===2?' : '+scores[1]:' goli')+' · '+(round+1)+'/5'}
function answer(p,c){let d=data[p];if(d.idx>=3||finished)return;let item=current[d.order[d.idx]];d.answers.push({word:item.word,category:item.category,choice:c,correct:c===item.category});d.idx++;d.opts=null;if(d.idx===3)d.elapsed=performance.now()-d.started;render();if(data.every(x=>x.idx===3)){finished=true;setTimeout(kick,350)}}
function kick(){let p=mode===1?0:turn%2,att=data[p],def=mode===2?data[1-p]:null,a=att.answers.filter(x=>x.correct).length,b=def?def.answers.filter(x=>x.correct).length:0;shotGoal=mode===1?a>=2:(a>b||(a===b&&att.elapsed<def.elapsed));if(shotGoal)scores[p]++;history[p].push({goal:shotGoal,words:current.map(x=>x.word)});show('shot');$('shotTitle').textContent='Rzut '+(round+1)+' · Gracz '+(p+1);$('shotText').textContent='';$('reviewBtn').classList.add('hidden');let ball=$('ball'),keeper=$('keeper');ball.style.transition='none';keeper.style.transition='none';ball.style.left='50%';ball.style.top='77%';keeper.style.transform='translate(-50%,-50%)';let dir=Math.random()<.5?-1:1;setTimeout(()=>{ball.style.transition='left .85s ease-in,top .85s ease-in';keeper.style.transition='transform .65s';let strong=mode===1?a===3:shotGoal&&a===3;ball.style.left=shotGoal?(strong?(dir<0?'23%':'77%'):(dir<0?'30%':'70%')):'50%';ball.style.top=shotGoal?'14%':'23%';keeper.style.transform='translate(calc(-50% + '+(shotGoal&&strong?-dir*95:dir*45)+'px),-50%) rotate('+(dir*65)+'deg)'},350);setTimeout(()=>{$('shotText').textContent=shotGoal?'GOOOL! ⚽':'OBRONA! 🧤';$('reviewBtn').classList.remove('hidden')},1450)}
function review(){show('summary');$('summaryTitle').textContent=shotGoal?'⚽ Gol!':'🧤 Obrona!';let h='<div class="score">Wynik: '+scores[0]+(mode===2?' : '+scores[1]:' / 5')+'</div>';for(let p=0;p<mode;p++){let d=data[p];h+='<article><b>Gracz '+(p+1)+' · '+d.answers.filter(x=>x.correct).length+'/3 · '+(d.elapsed/1000).toFixed(2)+' s</b>';for(let a of d.answers)h+='<p class="'+(a.correct?'ok':'bad')+'">'+(a.correct?'✓':'✗')+' '+a.word+' — '+labels[a.choice]+(a.correct?'':' → '+labels[a.category])+'</p>';h+='</article>'}$('summaryContent').innerHTML=h;let end=mode===1?round===4:round===4&&turn===1;$('nextBtn').textContent=end?'Zakończ mecz':'Następny rzut'}
function next(){if(mode===2&&turn===0){turn=1;nextRound();return}turn=0;round++;if(round>=5){show('summary');$('summaryTitle').textContent='Koniec meczu!';$('summaryContent').innerHTML='<div class="score">'+(mode===1?'Zdobyte gole: '+scores[0]+' / 5':scores[0]===scores[1]?'Remis '+scores[0]+':'+scores[1]:'Wygrywa gracz '+(scores[0]>scores[1]?1:2)+'! '+scores.join(':'))+'</div><p class="small">Wersja 0.1.0 – dogrywka po remisie będzie dodana w kolejnej aktualizacji.</p>';$('nextBtn').textContent='Menu główne';$('nextBtn').onclick=()=>{ $('nextBtn').onclick=next;show('menu')};return}nextRound()}
categories();
</script></body></html>
